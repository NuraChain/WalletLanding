<!doctype html>
<html>
  <head>
    <!--
      The root element above carries no lang/dir on purpose: each prerendered
      page sets its own (Persian gets lang="fa" dir="rtl") from
      src/components/Seo.tsx, and the SSG injector prepends attributes to the
      first "<html" it finds rather than replacing them. That is also why this
      comment is inside <head>: it must not come before the root element.
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The size each platform asks for, all rendered from /favicon.png by
      `npm run icons`. The .ico is what a browser requests whether or not it is
      named here, and what a tab is drawn from; 192 is Android and anything
      that wants more pixels; 180 is the iOS home screen. Android's maskable
      icon is named only in the manifest, and the 512 master itself only by the
      header mark and the JSON-LD logo.
    -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#070b12" />

    <!--
      First visit only: reads the browser's languages and replaces this URL
      with that language's page, English if none of them is one we have. The
      script is generated from the locale list and written in here at build
      time by plugins/locale-redirect.ts, which is also where the reasoning is.

      Its position is deliberate. It must run before anything is painted, and
      a synchronous script placed after a stylesheet waits for that stylesheet
      to load - so it goes above the font link below, and below <meta charset>.
    -->
    <!--locale-redirect-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The Latin faces every language uses. Per-script additions come from Seo.tsx. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />

    <!--
      Content meta (title, description, canonical, hreflang, Open Graph,
      JSON-LD) lives in src/components/Seo.tsx and is prepended into this head
      at build time. Keep those tags out of this file: the SSG injector
      prepends rather than replaces, so anything duplicated here ships twice.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
