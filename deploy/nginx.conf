# Serving the built site.
#
# The domain is not in the source tree. `npm run build` writes every absolute
# URL - canonical, hreflang, Open Graph, JSON-LD, robots.txt, sitemap.xml - with
# the placeholder origin https://origin.invalid (ORIGIN_PLACEHOLDER in
# src/site.config.ts), and the sub_filter rule below replaces it with the host
# this server actually answers as. The domain is written once, in server_name.
#
# Requires ngx_http_sub_module:
#
#     nginx -V 2>&1 | grep -o with-http_sub_module
#
# It is compiled into the nginx.org packages, Debian/Ubuntu nginx-full and
# nginx-extras, and Alpine's nginx. Debian's nginx-light does not have it, and
# without it the site ships origin.invalid in every canonical.

server {
    listen      80;
    listen      [::]:80;
    server_name wallet.example.com;

    return 308 https://$host$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;               # nginx < 1.25.1: use `listen 443 ssl http2;`

    # The one place the domain appears. $server_name below reads it back, so
    # it is also what every canonical URL on the site will say. If several
    # names are listed here, nginx takes the first - put the canonical one
    # first and redirect the rest.
    server_name wallet.example.com;

    ssl_certificate     /etc/letsencrypt/live/wallet.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wallet.example.com/privkey.pem;

    root  /var/www/wallet-landing/dist;
    index index.html;

    # Put the real origin into the responses. text/html is always filtered;
    # sitemap.xml (text/xml) and robots.txt (text/plain) carry absolute URLs
    # that the formats require, so they have to be named explicitly.
    #
    # $server_name, not $host: $host is whatever the client sent, and a
    # canonical tag built from a client-supplied header is worth nothing.
    sub_filter_types text/xml text/plain;
    sub_filter       'https://origin.invalid' '$scheme://$server_name';
    sub_filter_once  off;

    # sub_filter cannot rewrite a body it never decompressed. Serving a
    # pre-compressed .gz would skip the rewrite silently, so keep this off.
    gzip_static off;

    gzip       on;
    gzip_types text/css application/javascript image/svg+xml text/xml text/plain application/json;

    # The build uses dirStyle: 'nested', so every page is <path>/index.html.
    # `$uri/` lets the index directive find it, and redirects /fa/blog to
    # /fa/blog/ on the way. No SPA fallback on purpose: a URL that was not
    # prerendered does not exist, and a 404 is the honest answer.
    location / {
        try_files $uri $uri/ =404;
    }

    # Pages carry the rewritten origin and change on every deploy, so they are
    # revalidated rather than cached. Assets are content-hashed and are not.
    expires    -1;
    add_header Cache-Control "no-cache" always;

    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable" always;
        try_files  $uri =404;
    }
}
